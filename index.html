        { title: 'What is Python?', simple: 'Python is a high-level, easy-to-read programming language created by Guido van Rossum in 1991. It reads almost like plain English, making it the #1 choice for beginners and AI engineers.', code: '# Python reads just like English\nprint("Welcome to Python!")', output: 'Welcome to Python!', q: 'Why is Python so popular for beginners?', opts: ['Its syntax reads like plain English', 'It only runs on calculators', 'It requires manual memory wiring', 'It cannot do math'], ans: 0, exp: 'Python uses clean indentation and readable English keywords instead of heavy punctuation.' },
        { title: 'What is Python Used For?', simple: 'Python powers Artificial Intelligence (ChatGPT backends), websites (Instagram, Spotify), data science, cybersecurity tools, and everyday task automation.', code: 'uses = ["AI & ML", "Web Apps", "Data Science", "Automation"]\nprint("Top use:", uses[0])', output: 'Top use: AI & ML', q: 'Which field heavily relies on Python today?', opts: ['Artificial Intelligence & Data Science', 'Painting physical walls', 'Building wooden furniture', 'Analog radio tuning'], ans: 0, exp: 'Python dominates AI, Machine Learning, backend web development, and automation.' },

        { title: 'For Loops (Repeating Actions)', simple: 'A for loop steps through every item in a list or range of numbers, running your code once per item automatically.', code: 'for n in range(1, 4):\n    print("Step", n)', output: 'Step 1\nStep 2\nStep 3', q: 'How many times does "for i in range(5):" repeat?', opts: ['5 times (0 to 4)', '6 times (0 to 5)', '4 times (1 to 4)', 'Infinite times'], ans: 0, exp: 'range(5) produces 5 numbers: 0, 1, 2, 3, and 4.' },

        { title: 'Functions with def', simple: 'A function is a reusable mini-program created with the def keyword. Write it once, and call it by name whenever needed.', code: 'def greet(user):\n    return f"Hello, {user}!"\n\nprint(greet("Dev"))', output: 'Hello, Dev!', q: 'Which keyword is used to create a function in Python?', opts: ['def', 'function', 'func', 'define'], ans: 0, exp: 'Python defines functions using the short keyword "def" followed by the function name.' }

        // Select 100 per level without cycling a concept through generic labels.
        expanded.slice(0, 100).forEach((entry, i) => {

          const key = state.user.email.toLowerCase();
          if (accounts[key]) {
            accounts[key].name = state.user.name;
            accounts[key].goal = state.user.goal;
            accounts[key].xp = state.xp;
            accounts[key].completed = state.completed;
            saveAccounts(accounts);
          }

      } catch (e) {
        console.warn('Could not save state:', e);
      }
      updateHeaderUI();

      const bottomNav = document.getElementById('app-bottom-nav');

      if (bottomNav) bottomNav.style.display = state.isAuthenticated ? '' : 'none';

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      if (!box) return;
      box.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 2600);
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Shuffle options deterministically per lesson view while tracking the right answer
    let currentQuizState = null;

    function prepareQuizForLesson(lesson) {
      const indexed = lesson.options.map((opt, i) => ({
        text: opt,
        // Keep the curriculum's original index even after the display shuffle.
        originalIndex: i,
        isCorrect: i === lesson.correctIndex
      }));
      // Shuffle options so correct answer isn't always first
      for (let i = indexed.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
      }
      currentQuizState = {
        lessonId: lesson.id,
        options: indexed,
        selectedIdx: null,
        answered: false,
        simulated: false,
        saveError: false
      };
    }

    /**
     * ============================================================================
     * NAVIGATION & VIEW RENDERERS
     * ============================================================================
     */
    function navigate(view, params = {}) {
      state.view = view;
      if (params.trackId) state.activeTrack = params.trackId;
      if (params.level) state.activeLevel = params.level;
      if (params.lessonId) {
        state.activeLessonId = params.lessonId;
        const lessons = getTrackLessons(state.activeTrack);
        const found = lessons.find(l => l.id === params.lessonId);
        if (found) {
          state.activeLevel = found.level;
          prepareQuizForLesson(found);
        }
      }

      // Highlight bottom nav
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isMatch = btn.dataset.nav === view || (view === 'lesson' && btn.dataset.nav === 'tracks');
        btn.className = isMatch
          ? 'nav-btn flex flex-col items-center justify-center py-2 rounded-xl text-xs font-semibold transition text-blue-400 bg-blue-500/10'
          : 'nav-btn flex flex-col items-center justify-center py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-slate-200';
      });

      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openTrack(trackId, level = 'intro') {
      navigate('tracks', { trackId, level });
    }

    function openLesson(lessonId) {
      navigate('lesson', { lessonId });
    }

      else if (state.view === 'progress') root.innerHTML = renderProgressView();
      else if (state.view === 'profile') root.innerHTML = renderProfileView();
    }

    async function getOrCreateCloudProfile(user, fallbackName, fallbackGoal) {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('id, full_name, learning_goal, xp, completed_lessons, created_at')
        .eq('id', user.id)
        .maybeSingle();
      if (error) throw error;
      if (data) return data;

      const profileToInsert = {
        id: user.id,
        full_name: fallbackName || user.user_metadata?.full_name || user.email?.split('@')[0] || 'Student',
        learning_goal: fallbackGoal || 'Full-Stack & Market Mastery'
      };
      const { data: inserted, error: insertError } = await supabaseClient
        .from('profiles')
        .insert(profileToInsert)
        .select('id, full_name, learning_goal, xp, completed_lessons, created_at')
        .single();
      if (insertError) throw insertError;
      return inserted;
    }

    function applyCloudProfile(user, profile) {
      const cloudCompletions = profile.completed_lessons || {};
      const completed = {};
      Object.entries(cloudCompletions).forEach(([key, value]) => {
        if (value) {
          const separator = key.indexOf(':');
          const lessonId = separator >= 0 ? key.slice(separator + 1) : key;
          completed[lessonId] = true;
        }
      });
      state.isAuthenticated = true;
      state.user = {
        name: profile.full_name || user.user_metadata?.full_name || user.email?.split('@')[0] || 'Student',
        email: user.email || '',
        goal: profile.learning_goal || 'Full-Stack & Market Mastery',
        joined: profile.created_at ? new Date(profile.created_at).toLocaleDateString() : new Date().toLocaleDateString()
      };
      state.xp = Number(profile.xp || 0);
      state.completed = completed;
      state.view = 'home';
      saveState();
      renderApp();
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      if (!supabaseClient) {
        showToast('Supabase could not load. Check your internet connection and reload.');
        return;
      }
      if (cloudBusy) return;
      cloudBusy = true;
      const submitButton = e.submitter || e.target.querySelector('button[type="submit"]');
      if (submitButton) { submitButton.disabled = true; submitButton.textContent = 'Connecting securely…'; }

      const email = (document.getElementById('auth-email').value || '').trim().toLowerCase();
      const password = document.getElementById('auth-password').value || '';
      try {
        if (password.length < 8) throw new Error('Use a password with at least 8 characters.');

        if (authMode === 'register') {
          const name = (document.getElementById('auth-name').value || '').trim();
          const goal = document.getElementById('auth-goal').value || 'Full-Stack & Market Mastery';
          if (!name) throw new Error('Enter your full name.');
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { full_name: name, learning_goal: goal } }
          });
          if (error) throw error;
          if (!data.session || !data.user) {
            showToast('Account created. Check your email to confirm, then sign in.');
            authMode = 'login';
            renderApp();
            return;
          }
          const profile = await getOrCreateCloudProfile(data.user, name, goal);
          // Store the selected goal after the profile row is available.
          const { data: updated, error: updateError } = await supabaseClient
            .from('profiles').update({ full_name: name, learning_goal: goal, updated_at: new Date().toISOString() })
            .eq('id', data.user.id)
            .select('id, full_name, learning_goal, xp, completed_lessons, created_at').single();
          if (updateError) throw updateError;
          applyCloudProfile(data.user, updated || profile);
          showToast(`Welcome to MAGNETIX, ${name}!`);
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          const profile = await getOrCreateCloudProfile(data.user);
          applyCloudProfile(data.user, profile);
          showToast(`Welcome back, ${state.user.name}!`);
        }
      } catch (error) {
        console.error('MAGNETIX authentication error:', error);
        showToast(error.message || 'Could not connect to your account.');
      } finally {
        cloudBusy = false;
        if (submitButton && submitButton.isConnected) {
          submitButton.disabled = false;
          submitButton.textContent = authMode === 'login' ? 'Sign In to MAGNETIX →' : 'Start Learning Free →';
        }
      }
    }

    async function restoreSupabaseSession() {
      loadState();
      // Remove legacy browser-only account records, which stored demo passwords locally.
      try { localStorage.removeItem(ACCOUNTS_KEY); } catch (e) { console.warn('Could not clear legacy demo accounts:', e); }
      if (!supabaseClient) {
        state.isAuthenticated = false;
        renderApp();
        showToast('Supabase library unavailable. Check your connection.');
        return;
      }
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) console.error('Session restore error:', error);
      if (data?.session?.user) {
        try {
          const profile = await getOrCreateCloudProfile(data.session.user);
          applyCloudProfile(data.session.user, profile);
        } catch (profileError) {
          console.error('Profile load error:', profileError);
          state.isAuthenticated = false;
          renderApp();
          showToast('Signed in, but profile could not load. Check Supabase policies.');
        }
      } else {
        state.isAuthenticated = false;
        renderApp();
      }
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT' || !session) {
          state.isAuthenticated = false;
          renderApp();
        }
      });
    }

                    <span class="text-xs font-extrabold uppercase tracking-wider ${isSelected ? 'text-blue-400' : 'text-slate-400'}">${lvl.label}</span>
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-slate-800 text-slate-300">${lvlDone}/${lvl.count}</span>
                  </div>
                  <div class="text-[11px] text-slate-400 mt-1.5 truncate">${lvl.subtitle}</div>
                </button>
              `;
            }).join('')}
          </div>

          <!-- Topics Grid -->
          <div class="space-y-2.5">
            <div class="flex items-center justify-between px-1">
              <h2 class="text-sm font-bold text-slate-300">
                Showing ${levelLessons.length} Unique ${LEVELS.find(l => l.id === state.activeLevel).label} Topics
              </h2>
              <span class="text-xs text-slate-500">Tap any topic to learn & practice</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
              ${levelLessons.map(lesson => {
                const isDone = !!state.completed[lesson.id];
                return `
                  <button onclick="openLesson('${lesson.id}')"
                    class="w-full text-left p-4 rounded-xl border transition flex items-center justify-between gap-3 ${
                      isDone
                        ? 'bg-emerald-950/20 border-emerald-500/30 hover:border-emerald-400/50'
                        : 'glass-panel hover:border-blue-500/40'
                    }">
                    <div class="flex items-center gap-3 min-w-0">
                      <span class="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-extrabold shrink-0 ${
                        isDone ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-300'
                      }">
                        ${isDone ? '✓' : lesson.number}
                      </span>
                      <div class="min-w-0">
                        <div class="text-sm font-bold text-white truncate">${escapeHTML(lesson.title)}</div>
                        <div class="text-xs text-slate-400 truncate mt-0.5">${escapeHTML(lesson.simple)}</div>
                      </div>
                    </div>
                    <span class="text-xs font-semibold text-blue-400 shrink-0">Study →</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * 3. INTERACTIVE LESSON & MCQ VIEW
     */
    function renderLessonView() {
      const allLessons = getTrackLessons(state.activeTrack);
      const currentIdx = allLessons.findIndex(l => l.id === state.activeLessonId);
      const lesson = allLessons[currentIdx >= 0 ? currentIdx : 0];
      const track = TRACKS.find(t => t.id === lesson.trackId);

      if (!currentQuizState || currentQuizState.lessonId !== lesson.id) {
        prepareQuizForLesson(lesson);
      }

      const prevLesson = currentIdx > 0 ? allLessons[currentIdx - 1] : null;
      const nextLesson = currentIdx < allLessons.length - 1 ? allLessons[currentIdx + 1] : null;
      const isCompleted = !!state.completed[lesson.id];

      return `
        <div class="max-w-3xl mx-auto space-y-5 animate-in">
          <!-- Top Breadcrumb & Back -->
          <div class="flex items-center justify-between gap-2">
            <button onclick="openTrack('${track.id}', '${lesson.level}')" class="px-3 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs font-semibold text-slate-300 transition">
              ← Back to ${track.name} (${LEVELS.find(l => l.id === lesson.level).label})
            </button>
            <div class="flex items-center gap-2">
              ${isCompleted ? `<span class="px-2.5 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-bold">✓ Completed (+${getXPForLesson(lesson)} XP)</span>` : `<span class="px-2.5 py-1 rounded-full bg-blue-500/15 border border-blue-500/30 text-blue-300 text-xs font-bold">+${getXPForLesson(lesson)} XP Available</span>`}
            </div>
          </div>

          <!-- Concept Card -->
          <article class="glass-panel rounded-2xl p-6 sm:p-7 space-y-5 shadow-xl">
            <div class="space-y-2">
              <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-blue-400">
                <span>${track.icon} ${track.name}</span>
                <span>•</span>
                <span>${LEVELS.find(l => l.id === lesson.level).label} #${lesson.number}</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                ${escapeHTML(lesson.title)}
              </h1>
            </div>

            <!-- Simple, Clear Concept Explanation -->
            <div class="p-4 sm:p-5 rounded-xl bg-blue-950/25 border border-blue-500/20">
              <div class="text-xs font-bold uppercase tracking-wider text-blue-300 mb-1.5">💡 Simple Explanation</div>
              <p class="text-slate-200 text-sm sm:text-base leading-relaxed">
                ${escapeHTML(lesson.simple)}
              </p>
            </div>

            <!-- Interactive Code / Market Example -->
            <div class="space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400">
                  ${track.id === 'tradex' ? '📊 Market Setup & Example' : '💻 Practical Code Example'}
                </span>
                <button onclick="simulateExample()" class="px-3 py-1.5 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 text-xs font-bold transition flex items-center gap-1.5">
                  <span>▶</span>
                  <span>${currentQuizState.simulated ? 'Output Simulated' : 'Run / Simulate Example'}</span>
                </button>
              </div>

              <pre class="code-surface rounded-xl p-4 font-mono text-xs sm:text-sm text-cyan-200 overflow-x-auto leading-relaxed">${escapeHTML(lesson.code)}</pre>

              <!-- Simulated Output Box -->
              <div class="rounded-xl bg-slate-950 border ${currentQuizState.simulated ? 'border-emerald-500/50' : 'border-slate-800'} p-3.5 transition">
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                  ${track.id === 'tradex' ? 'Expected Market Outcome:' : 'Console / Output Preview:'}
                </div>
                <pre class="font-mono text-xs sm:text-sm ${currentQuizState.simulated ? 'text-emerald-400' : 'text-slate-300'} whitespace-pre-wrap">${escapeHTML(lesson.output)}</pre>
              </div>
            </div>
          </article>

          <!-- Interactive Practice MCQ Card -->
          <section class="glass-panel rounded-2xl p-6 sm:p-7 space-y-5 shadow-xl border-t-2 border-t-blue-500">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold uppercase tracking-wider text-amber-400">🎯 Interactive Practice Question</span>
              <span class="text-xs text-slate-400">Select the best answer</span>
            </div>

            <h2 class="text-base sm:text-lg font-bold text-white leading-snug">
              ${escapeHTML(lesson.question)}
            </h2>

            <!-- 4 MCQ Options -->
            <div class="space-y-2.5">
              ${currentQuizState.options.map((opt, idx) => {
                let btnStyle = 'bg-slate-900/90 hover:bg-slate-800 border-slate-700/90 text-slate-200';
                let badge = String.fromCharCode(65 + idx);

                if (currentQuizState.answered) {
                  if (opt.isCorrect) {
                    // Correct answer ALWAYS turns GREEN
                    btnStyle = 'bg-emerald-600/25 border-emerald-500 text-emerald-100 ring-2 ring-emerald-500/40';
                    badge = '✓';
                  } else if (idx === currentQuizState.selectedIdx && !opt.isCorrect) {
                    // Wrong selected answer turns RED
                    btnStyle = 'bg-rose-600/25 border-rose-500 text-rose-100 ring-2 ring-rose-500/40';
                    badge = '✕';
                  } else {
                    btnStyle = 'bg-slate-900/40 border-slate-800 text-slate-500 opacity-75';
                  }
                }

                return `
                  <button onclick="selectMCQOption(${idx})"
                    class="w-full text-left p-4 rounded-xl border transition-all flex items-center gap-3.5 ${btnStyle}">
                    <span class="w-7 h-7 rounded-lg bg-slate-800/90 border border-white/10 flex items-center justify-center text-xs font-extrabold shrink-0">
                      ${badge}
                    </span>
                    <span class="text-sm font-medium leading-snug">${escapeHTML(opt.text)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Feedback & Explanation Box -->
            ${currentQuizState.answered ? `
              <div class="p-4 rounded-xl border ${
                currentQuizState.options[currentQuizState.selectedIdx].isCorrect
                  ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-200'
                  : 'bg-rose-950/40 border-rose-500/40 text-rose-200'
              } animate-in">
                <div class="font-bold text-sm mb-1">
                  ${currentQuizState.options[currentQuizState.selectedIdx]?.isCorrect
                    ? '✅ Correct! Great job mastering this concept.'
                    : '❌ Not quite right — Review the explanation below:'}
                </div>
                <p class="text-xs sm:text-sm opacity-95 leading-relaxed">
                  ${escapeHTML(lesson.explanation)}
                </p>
                ${currentQuizState.saveError && currentQuizState.options[currentQuizState.selectedIdx]?.isCorrect ? `
                  <button onclick="retryLessonXP()" class="mt-3 px-3 py-2 rounded-lg bg-emerald-600/20 border border-emerald-500/40 text-emerald-200 text-xs font-bold hover:bg-emerald-600/30">
                    Retry XP save
                  </button>
                ` : ''}
              </div>
            ` : ''}

            <!-- Bottom Lesson Navigation (Previous & Next Lesson) -->
            <div class="pt-3 border-t border-slate-800 flex items-center justify-between gap-3">
              ${prevLesson ? `
                <button onclick="openLesson('${prevLesson.id}')" class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-bold transition">
                  ← Previous
                </button>
              ` : '<div></div>'}

              ${nextLesson ? `
                <button onclick="openLesson('${nextLesson.id}')" class="px-5 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs sm:text-sm font-bold shadow-lg shadow-blue-600/25 transition ml-auto">
                  Next Lesson →
                </button>
              ` : `
                <button onclick="openTrack('${track.id}', 'intro')" class="px-5 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-bold transition ml-auto">
                  Track Complete! Return to Syllabus ✓
                </button>
              `}
            </div>
          </section>
        </div>
      `;
    }

    function simulateExample() {
      if (currentQuizState) {
        currentQuizState.simulated = true;
        renderApp();
        showToast('▶ Example executed successfully!');
      }
    }

    async function selectMCQOption(idx) {
      if (!currentQuizState || currentQuizState.answered) return;
      const chosen = currentQuizState.options[idx];
      if (!chosen) return;
      currentQuizState.selectedIdx = idx;
      currentQuizState.answered = true;

      if (chosen.isCorrect && !state.completed[currentQuizState.lessonId]) {
        const lesson = getTrackLessons(state.activeTrack).find(item => item.id === currentQuizState.lessonId);
        if (state.user.email === 'guest@magnetix.edu') {
          state.completed[currentQuizState.lessonId] = true;
          const awardedXP = getXPForLesson(lesson);
          state.xp += awardedXP;
          saveState();
          showToast(`Correct! +${awardedXP} demo XP earned.`);
        } else if (supabaseClient) {
          try {
            const { data, error } = await supabaseClient.rpc('complete_magnetix_lesson', {
              p_lesson_id: currentQuizState.lessonId,
              p_track_id: lesson?.trackId || state.activeTrack,
              // The RPC validates the original curriculum answer index, not the shuffled UI position.
              p_answer_index: chosen.originalIndex
            });
            if (error) throw error;
            state.completed[currentQuizState.lessonId] = true;
            const awardedXP = Number(data?.xp_awarded ?? (data?.awarded ? getXPForLesson(lesson) : 0));
            state.xp = Number(data?.xp ?? (state.xp + awardedXP));
            currentQuizState.saveError = false;
            saveState();
            showToast(data?.awarded ? `Correct! +${awardedXP} XP saved to your account.` : 'Lesson already completed. XP was not added again.');
          } catch (error) {
            console.error('Lesson progress sync error:', error);
            // Keep the correct-answer feedback visible; allow the learner to retry the cloud save.
            currentQuizState.saveError = true;
            showToast(error.message || 'Correct answer, but XP could not be saved. Tap Retry XP save.');
          }
        } else {
          currentQuizState.saveError = true;
          showToast('Correct answer. Cloud connection unavailable; tap Retry XP save when connected.');
        }
      }
      renderApp();
    }

    async function retryLessonXP() {
      if (!currentQuizState || !currentQuizState.answered || currentQuizState.selectedIdx === null) return;
      const chosen = currentQuizState.options[currentQuizState.selectedIdx];
      if (!chosen?.isCorrect || !supabaseClient) {
        showToast('Cloud connection unavailable. Please reconnect and try again.');
        return;
      }
      if (state.user.email === 'guest@magnetix.edu') {
        let awardedXP = 0;
        if (!state.completed[currentQuizState.lessonId]) {
          const lesson = getTrackLessons(state.activeTrack).find(item => item.id === currentQuizState.lessonId);
          awardedXP = getXPForLesson(lesson);
          state.completed[currentQuizState.lessonId] = true;
          state.xp += awardedXP;
          saveState();
        }
        currentQuizState.saveError = false;
        renderApp();
        showToast(awardedXP ? `Correct! +${awardedXP} demo XP earned.` : 'This topic was already completed; no extra XP was added.');
        return;
      }
      try {
        const lesson = getTrackLessons(state.activeTrack).find(item => item.id === currentQuizState.lessonId);
        const { data, error } = await supabaseClient.rpc('complete_magnetix_lesson', {
          p_lesson_id: currentQuizState.lessonId,
          p_track_id: lesson?.trackId || state.activeTrack,
          p_answer_index: chosen.originalIndex
        });
        if (error) throw error;
        const awardedXP = Number(data?.xp_awarded ?? (data?.awarded ? getXPForLesson(lesson) : 0));
        state.completed[currentQuizState.lessonId] = true;
        state.xp = Number(data?.xp ?? state.xp);
        currentQuizState.saveError = false;
        saveState();
        renderApp();
        showToast(data?.awarded ? `Correct! +${awardedXP} XP saved to your account.` : 'Lesson already completed. XP was not added again.');
      } catch (error) {
        console.error('Lesson XP retry error:', error);
        showToast(error.message || 'XP save failed again. Please try later.');
      }
    }

    /**
     * 4. PROGRESS & SEARCH VIEW
     */
    function renderProgressView() {
      const q = (state.searchQuery || '').toLowerCase().trim();
      let matches = [];

      if (q.length >= 2) {
        TRACKS.forEach(t => {
          const lessons = getTrackLessons(t.id);
          lessons.forEach(l => {
            if (l.title.toLowerCase().includes(q) || l.simple.toLowerCase().includes(q)) {
              matches.push({ ...l, trackName: t.name, trackIcon: t.icon });
            }
          });
        });
      }

      return `
        <div class="space-y-6 animate-in">
          <div class="glass-panel rounded-2xl p-6 space-y-4">
            <h1 class="text-xl sm:text-2xl font-extrabold text-white">Curriculum Search & Progress</h1>
            <p class="text-xs sm:text-sm text-slate-400">
              Search across all 2,560 CODEX and TRADEX lessons or track your completion across every language.
            </p>
            <input type="text" value="${escapeHTML(state.searchQuery)}" oninput="handleSearchInput(this.value)"
              placeholder="Search any topic (e.g., print, Pointers, Flexbox, Candlestick, Options, Async)..."
              class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 focus:border-blue-500 focus:outline-none text-sm text-white placeholder-slate-500" />
          </div>

          ${q.length >= 2 ? `
            <div class="space-y-2.5">
              <div class="text-xs font-bold text-slate-400 px-1">Found ${matches.length} matching topics (showing top 40)</div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                ${matches.slice(0, 40).map(m => `
                  <button onclick="openTrack('${m.trackId}', '${m.level}'); openLesson('${m.id}')"
                    class="p-4 rounded-xl glass-panel hover:border-blue-500/40 text-left flex items-center justify-between gap-3 transition">
                    <div class="min-w-0">
                      <div class="text-[11px] font-bold text-blue-400">${m.trackIcon} ${m.trackName} • ${m.level.toUpperCase()}</div>
                      <div class="text-sm font-bold text-white truncate mt-0.5">${escapeHTML(m.title)}</div>
                    </div>
                    <span class="text-xs font-bold text-slate-300 shrink-0">Open →</span>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              ${TRACKS.map(track => {
                const done = Object.keys(state.completed).filter(k => k.startsWith(track.id + '-')).length;
                const pct = Math.round((done / 320) * 100);
                return `
                  <div class="glass-panel rounded-2xl p-5 space-y-3">
                    <div class="flex items-center justify-between">
                      <div class="flex items-center gap-2.5">
                        <span class="text-xl">${track.icon}</span>
                        <span class="font-bold text-white">${track.name}</span>
                      </div>
                      <span class="text-xs font-bold text-slate-300">${done} / 320 (${pct}%)</span>
                    </div>
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                      <div class="h-full bg-gradient-to-r ${track.color}" style="width: ${pct}%"></div>
                    </div>
                    <div class="flex justify-between pt-1">
                      <button onclick="openTrack('${track.id}', 'intro')" class="text-xs font-bold text-blue-400 hover:underline">Continue Learning →</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function handleSearchInput(val) {
      state.searchQuery = val;
      renderApp();
      // Keep focus on search input after re-render
      const inp = document.querySelector('input[type="text"]');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }

    /**
     * 5. PROFILE & SETTINGS VIEW
     */
    function renderProfileView() {
      const completedCount = Object.keys(state.completed).length;
      const rank = state.xp >= 1000 ? 'Grandmaster Architect' : state.xp >= 300 ? 'Market & Code Builder' : 'Rising Explorer';

      return `
        <div class="max-w-xl mx-auto space-y-5 animate-in">
          <div class="glass-panel rounded-2xl p-6 space-y-5">
            <div class="flex items-center gap-4">
              <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-emerald-400 flex items-center justify-center text-2xl font-extrabold text-white shadow-lg">
                ${escapeHTML((state.user.name || 'S')[0].toUpperCase())}
              </div>
              <div>
                <h1 class="text-xl font-extrabold text-white">${escapeHTML(state.user.name || 'Student')}</h1>
                <div class="text-xs font-semibold text-emerald-400 mt-0.5">🏅 ${rank}</div>
                <div class="text-xs text-slate-400 mt-0.5">${completedCount} Lessons Completed • ${state.xp} XP</div>
              </div>
            </div>

            <form onsubmit="saveProfileForm(event)" class="space-y-4 pt-2 border-t border-slate-800">
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Display Name</label>
                <input id="prof-name" type="text" value="${escapeHTML(state.user.name || '')}" required
                  class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 focus:border-blue-500 focus:outline-none text-sm text-white" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-300 mb-1.5">Learning Goal</label>
                <input id="prof-goal" type="text" value="${escapeHTML(state.user.goal || '')}"
                  class="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-700 focus:border-blue-500 focus:outline-none text-sm text-white" />
              </div>
              <button type="submit" class="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm transition">
                Save Student Profile
              </button>
            </form>

            <div class="pt-4 border-t border-slate-800 flex items-center justify-between gap-3">
              <div class="text-xs text-slate-400 truncate">
                Signed in as <span class="text-slate-200 font-semibold">${escapeHTML(state.user.email || 'Guest')}</span>
              </div>
              <button type="button" onclick="logoutUser()" class="px-4 py-2 rounded-xl bg-rose-600/15 hover:bg-rose-600/25 border border-rose-500/30 text-rose-300 text-xs font-bold transition shrink-0">
                Sign Out
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function saveProfileForm(e) {
      e.preventDefault();
      const nameVal = document.getElementById('prof-name').value.trim();
      const goalVal = document.getElementById('prof-goal').value.trim();
      if (!nameVal) { showToast('Enter your name.'); return; }
      if (state.user.email !== 'guest@magnetix.edu' && supabaseClient) {
        const { data: authData } = await supabaseClient.auth.getUser();
        const userId = authData?.user?.id;
        if (!userId) { showToast('Your session expired. Please sign in again.'); return; }
        const { error } = await supabaseClient.from('profiles')
          .update({ full_name: nameVal, learning_goal: goalVal, updated_at: new Date().toISOString() })
          .eq('id', userId);
        if (error) { showToast(error.message || 'Profile could not be saved.'); return; }
        await supabaseClient.auth.updateUser({ data: { full_name: nameVal } });
      }
      state.user.name = nameVal;
      state.user.goal = goalVal;
      saveState();
      renderApp();
      showToast('Profile updated and saved.');
    }

    // Boot: restore the Supabase session first; cloud data is the source of truth for signed-in students.
    restoreSupabaseSession();
  </script>
</body>
</html>
